[package]
name = "caliptra-fmc"
version = "0.1.0"
edition = "2021"

[dependencies]
caliptra-common = { workspace = true, default-features = false, features = ["fmc"] }
caliptra-cpu.workspace = true
caliptra-drivers = { workspace = true, features = ["fmc"] }
caliptra-error = { workspace = true, default-features = false }
caliptra-kat.workspace = true
caliptra-image-types = { workspace = true, default-features = false  }
caliptra-registers.workspace = true
caliptra-x509 = { workspace = true, default-features = false }
ufmt.workspace = true
zerocopy.workspace = true
caliptra-cfi-lib = { workspace = true, default-features = false, features = ["cfi", "cfi-counter" ] }
caliptra-cfi-derive.workspace = true
zeroize.workspace = true


[build-dependencies]
caliptra-common = { workspace = true, default-features = false }
caliptra-gen-linker-scripts.workspace = true
cfg-if.workspace = true

[dev-dependencies]
caliptra-api.workspace = true
caliptra-auth-man-gen.workspace = true
caliptra-builder = { workspace = true, default-features = false, features = ["openssl"] }
caliptra-hw-model.workspace = true
caliptra-image-types = { workspace = true, default-features = false }
caliptra-image-crypto.workspace = true
caliptra-test.workspace = true
openssl.workspace = true

[features]
default = ["std", "cfi", "2.2"]
"2.1" = [
    "caliptra-api/2.1",
    "caliptra-common/2.1",
    "caliptra-drivers/2.1",
    "caliptra-builder/2.1",
    "caliptra-hw-model/2.1",
    "caliptra-test/2.1",
    "caliptra-x509/2.1",
]
"2.2" = [
    "caliptra-api/2.2",
    "caliptra-common/2.2",
    "caliptra-drivers/2.2",
    "caliptra-builder/2.2",
    "caliptra-hw-model/2.2",
    "caliptra-test/2.2",
    "caliptra-x509/2.2",
]
emu = ["caliptra-common/emu", "caliptra-drivers/emu"]
fake-fmc = []
fpga_realtime = ["caliptra-drivers/fpga_realtime", "caliptra-hw-model/fpga_realtime"]
fpga_subsystem = ["caliptra-drivers/fpga_subsystem", "caliptra-hw-model/fpga_subsystem"]
itrng = ["caliptra-hw-model/itrng"]
cfi = [
    "caliptra-drivers/cfi",
    "caliptra-common/cfi",
]
riscv = ["caliptra-cpu/riscv"]
std = ["ufmt/std", "caliptra-common/std", "caliptra-drivers/std", "caliptra-cpu/std"]
verilator = ["caliptra-hw-model/verilator"]
