[package]
name = "caliptra-hw-model"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["profiling"]
verilator = ["dep:caliptra-verilated"]
fpga_realtime = ["dep:uio"]
itrng = ["caliptra-verilated?/itrng"]
coverage = ["dep:caliptra-coverage"]
"hw-1.0" = ["caliptra-emu-periph/hw-1.0"]
# Stack-sampling flamegraphs (InitParams::elfs, ModelEmulated::gen_flamegraph).
# Needs host-only crates (caliptra-builder, and through it OpenSSL); disable
# for targets without them, such as wasm32.
profiling = ["dep:caliptra-builder", "dep:inferno", "dep:rustc-demangle"]

[dependencies]
bitfield.workspace = true
bit-vec.workspace = true
caliptra-api-types.workspace = true
caliptra-builder = { workspace = true, optional = true }
caliptra-emu-bus.workspace = true
caliptra-emu-cpu.workspace = true
caliptra-emu-periph.workspace = true
caliptra-emu-types.workspace = true
caliptra-hw-model-types.workspace = true
caliptra-api.workspace = true
caliptra-registers.workspace = true
caliptra-verilated = { workspace = true, optional = true }
rand.workspace = true
sha2.workspace = true
uio = { workspace = true, optional = true }
ureg.workspace = true
zerocopy.workspace = true
caliptra-coverage = { workspace = true, optional = true }
caliptra-image-types.workspace = true
inferno = { version = "0.12.8", optional = true }
rustc-demangle = { version = "0.1.28", optional = true }

# Only the FPGA model and its tools use these, and they are Linux-only.
# Keeping them out of other targets lets the emulated model build for wasm32.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
nix.workspace = true

[dev-dependencies]
caliptra-builder.workspace = true
caliptra-registers.workspace = true
caliptra-test-harness-types.workspace = true
nix.workspace = true

[[bin]]
name = "fpga_realtime_mbox_pauser"
path = "src/bin/fpga_realtime_mbox_pauser.rs"
required-features = ["fpga_realtime"]
