name: FPGA Bitstream build

on:
  workflow_call:
    inputs:
      hw-version:
        description: Hardware version recorded in the bitstream manifest
        required: true
        type: string
      ref:
        description: Commit SHA to build
        required: true
        type: string
      rtl-version:
        description: RTL directory selector under hw, such as latest
        required: true
        type: string
      target-branch:
        description: Branch for the manifest and its update PR
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-bitstream:
    runs-on: [bitstream-builder]
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      matrix:
        segmented: [true, false]
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          ref: ${{ inputs.ref }}
          submodules: 'recursive'

      - name: Create Core bitstream
        env:
          STAGING_DIR: ${{ runner.temp }}/bitstream
          RTL_VERSION: ${{ inputs.rtl-version }}
          SEGMENTED: ${{ matrix.segmented }}
        run: |
          source /vck190-tools/Vivado/2024.2/settings64.sh
          mkdir -p "$STAGING_DIR"
          cd hw/fpga/
          /vck190-tools/Vivado/2024.2/bin/vivado -mode batch -source fpga_configuration.tcl \
            -tclargs BUILD=TRUE "RTL_VERSION=$RTL_VERSION" "SEGMENTED=$SEGMENTED"
          cp caliptra_build/*.xsa "$STAGING_DIR/"
          shopt -s nullglob
          PDI_FILES=(caliptra_build/*.pdi)
          if [ "${#PDI_FILES[@]}" -gt 0 ]; then
            cp "${PDI_FILES[@]}" "$STAGING_DIR/"
          fi

      - name: 'Upload bitstream'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: caliptra-bitstream-${{ inputs.hw-version }}-${{ matrix.segmented }}
          path: |
            ${{ runner.temp }}/bitstream/*.xsa
            ${{ runner.temp }}/bitstream/*.pdi
          retention-days: 7
          if-no-files-found: error

      - name: Bundle bitstream
        env:
          STAGING_DIR: ${{ runner.temp }}/bitstream
          HW_VERSION: ${{ inputs.hw-version }}
          RTL_VERSION: ${{ inputs.rtl-version }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          REPOSITORY: ${{ github.repository }}
          SEGMENTED: ${{ matrix.segmented }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          SS_COMMIT=$(git -C "hw/$RTL_VERSION/caliptra-ss" rev-parse HEAD)
          EXTRA_ARGS=()
          if [ "$SEGMENTED" = "true" ]; then
            EXTRA_ARGS+=(--segmented)
          fi

          shopt -s nullglob
          XSA_FILES=("$STAGING_DIR"/*.xsa)
          PDI_FILES=("$STAGING_DIR"/*.pdi)
          if [ "${#XSA_FILES[@]}" -ne 1 ]; then
            echo "Error: expected exactly one .xsa file from the bitstream build"
            exit 1
          fi

          if [ "${#PDI_FILES[@]}" -gt 1 ] || \
             { [ "$SEGMENTED" = "true" ] && [ "${#PDI_FILES[@]}" -ne 1 ]; }; then
            echo "Error: expected exactly one runtime .pdi for a segmented build, and at most one for a standard build"
            exit 1
          fi
          if [ "${#PDI_FILES[@]}" -eq 1 ]; then
            EXTRA_ARGS+=(--pdi-file "${PDI_FILES[0]}")
          fi

          # The bundle is left in the checkout (inside the runner's _work volume)
          # so the host-side post-job hook can find it and upload it to GCS.
          mkdir manifest-bundle

          caliptra-bitstream-downloader bundle-manifest \
            --repository "$REPOSITORY" \
            --hw-major-version "$HW_VERSION" \
            --target-branch "$TARGET_BRANCH" \
            --caliptra-variant "core" \
            --commit-hash "$COMMIT" \
            --caliptra-ss-commit "$SS_COMMIT" \
            --job-id "${{ github.run_id }}-${{ github.job }}" \
            "${EXTRA_ARGS[@]}" \
            --xsa-file "${XSA_FILES[0]}" \
            --output-dir manifest-bundle

      - name: 'Upload bitstream bundle'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: caliptra-bitstream-bundle-${{ inputs.hw-version }}-${{ matrix.segmented && 'segmented' || 'standard' }}
          path: manifest-bundle/caliptra-bitstream.tar.gz
          retention-days: 7
          if-no-files-found: error

      # Only publish segmented builds from non-PR runs through the runner hook.
      - name: Clean up unpublished bundle
        if: always() && (matrix.segmented == false || github.event_name == 'pull_request')
        run: rm -rf manifest-bundle

  open-pr:
    if: github.event_name != 'pull_request'
    needs: build-bitstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          ref: ${{ inputs.ref }}

      - name: Download updated manifest from GCS
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          URL="https://storage.googleapis.com/caliptra-github-ci-bitstreams/v1/$SOURCE_COMMIT/core/manifest.toml"
          TARGET_PATH="hw/fpga/bitstream_manifests/core.toml"
          DOWNLOADED_MANIFEST=$(mktemp)
          trap 'rm -f "$DOWNLOADED_MANIFEST"' EXIT
          echo "Downloading manifest from $URL to $TARGET_PATH"
          echo "MANIFEST_URL=$URL" >> "$GITHUB_ENV"

          for i in {1..30}; do
            if curl --silent --show-error --fail --max-time 30 -o "$DOWNLOADED_MANIFEST" "$URL"; then
              cp "$DOWNLOADED_MANIFEST" "$TARGET_PATH"
              echo "Successfully downloaded manifest!"
              exit 0
            fi
            echo "Waiting for manifest to be uploaded... (attempt $i)"
            if [ "$i" -lt 30 ]; then
              sleep 10
            fi
          done

          echo "Error: Failed to download manifest after 30 attempts."
          exit 1

      - name: Commit and Push changes
        run: |
          BRANCH_NAME="update-bitstream-${{ inputs.hw-version }}-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add hw/fpga/bitstream_manifests/core.toml
          git commit -m "Update bitstream manifest for run ${{ github.run_id }}"
          git push origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          HW_VERSION: ${{ inputs.hw-version }}
        run: |
          gh pr create \
            --title "Update HW $HW_VERSION core bitstream manifest: Run ${{ github.run_id }}" \
            --body "Automated update for run ${{ github.run_id }}. [GCS Manifest]($MANIFEST_URL)" \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH_NAME"
