name: FPGA Bitstream build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bitstream-build.yml"
      - "hw/**/*"
  pull_request:
    paths:
      - ".github/workflows/bitstream-build.yml"
      - "hw/**/*"

  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      variants: ${{ steps.set-matrix.outputs.variants }}
    steps:
      - name: Define build matrix
        id: set-matrix
        run: |
          MATRIX=$(cat <<'EOF'
          {
            "include": [
              { "variant": "core-latest-segmented",  "rtl_version": "latest",  "hw_major_version": "latest", "segmented": true  },
              { "variant": "core-latest-standard",   "rtl_version": "latest",  "hw_major_version": "latest", "segmented": false },
              { "variant": "core-rev-2_1-segmented", "rtl_version": "rev-2_1", "hw_major_version": "2.1",    "segmented": true  },
              { "variant": "core-rev-2_1-standard",  "rtl_version": "rev-2_1", "hw_major_version": "2.1",    "segmented": false }
            ]
          }
          EOF
          )
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> $GITHUB_OUTPUT
          echo "variants=$(echo "$MATRIX" | jq -c '[.include[] | select(.segmented) | .variant]')" >> $GITHUB_OUTPUT

  build-bitstream:
    needs: setup
    runs-on: [bitstream-builder]
    timeout-minutes: 1440 
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          submodules: 'recursive'

      - name: Create Core bitstream
        env:
          STAGING_DIR: ${{ runner.temp }}/bitstream
        run: |
          source /vck190-tools/Vivado/2024.2/settings64.sh
          mkdir -p "$STAGING_DIR"
          cd hw/fpga/
          /vck190-tools/Vivado/2024.2/bin/vivado -mode batch -source fpga_configuration.tcl \
            -tclargs BUILD=TRUE SEGMENTED=${{ matrix.segmented }} RTL_VERSION=${{ matrix.rtl_version }}
          cp caliptra_build/*.xsa "$STAGING_DIR/" || true
          cp caliptra_build/*.pdi "$STAGING_DIR/" || true

      - name: 'Upload bitstream'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: caliptra-bitstream-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/bitstream/*.xsa
            ${{ runner.temp }}/bitstream/*.pdi
          retention-days: 7

      - name: Bundle bitstream
        env:
          STAGING_DIR: ${{ runner.temp }}/bitstream
        run: |
          SEGMENTED_ARG=""
          if [ "${{ matrix.segmented }}" = "true" ]; then
            SEGMENTED_ARG="--segmented"
          fi
          
          # Find the xsa and pdi files in the staging directory
          XSA_FILE=$(ls "$STAGING_DIR"/*.xsa 2>/dev/null | head -n 1)
          PDI_FILE=$(ls "$STAGING_DIR"/*.pdi 2>/dev/null | head -n 1)

          if [ -z "$XSA_FILE" ]; then
            echo "Error: no .xsa file produced by the bitstream build"
            exit 1
          fi

          PDI_ARG=""
          if [ -n "$PDI_FILE" ]; then
            PDI_ARG="--pdi-file $PDI_FILE"
          fi

          # The bundle is left in the checkout (inside the runner's _work volume)
          # so the host-side post-job hook can find it and upload it to GCS.
          mkdir manifest-bundle
          
          caliptra-bitstream-downloader bundle-manifest \
            --repository "${{ github.repository }}" \
            --hw-major-version "${{ matrix.hw_major_version }}" \
            --target-branch "${{ github.base_ref || github.ref_name }}" \
            --caliptra-variant "${{ matrix.variant }}" \
            --commit-hash "${{ github.sha }}" \
            --job-id "${{ github.run_id }}-${{ github.job }}" \
            $SEGMENTED_ARG \
            ${{ github.event.pull_request.number && format('--github-pr {0}', github.event.pull_request.number) || '' }} \
            --xsa-file "$XSA_FILE" \
            $PDI_ARG \
            --output-dir manifest-bundle

      - name: 'Upload bitstream bundle'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: caliptra-bitstream-bundle-${{ matrix.variant }}
          path: manifest-bundle/caliptra-bitstream.tar.gz
          retention-days: 7

      # Both matrix jobs would otherwise upload a manifest to the same GCS path
      # (v1/<sha>/manifest.toml); only the segmented build is used by the FPGA CI.
      - name: Clean up bundle for non-segmented build
        if: matrix.segmented == false
        run: rm -rf manifest-bundle

  open-pr:
    needs: [setup, build-bitstream]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          submodules: 'recursive'

      - name: Download updated manifest from GCS
        run: |
          BASE_URL="https://storage.googleapis.com/caliptra-github-ci-bitstreams/v1/${{ github.sha }}"

          download_manifest() {
            local VARIANT="$1"
            local URL="${BASE_URL}/${VARIANT}/manifest.toml"
            local TARGET_PATH="hw/fpga/bitstream_manifests/${VARIANT}.toml"
            echo "Downloading manifest from $URL to $TARGET_PATH"
            for i in {1..30}; do
              if curl -s -f -o "$TARGET_PATH" "$URL"; then
                echo "Successfully downloaded $TARGET_PATH!"
                return 0
              fi
              echo "Waiting for manifest to be uploaded... (attempt $i)"
              sleep 10
            done
            echo "Error: Failed to download $TARGET_PATH after 5 minutes."
            return 1
          }

          for VARIANT in $(echo '${{ needs.setup.outputs.variants }}' | jq -r '.[]'); do
            download_manifest "$VARIANT"
          done

      - name: Commit and Push changes
        run: |
          BRANCH_NAME="update-bitstream-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git rm --ignore-unmatch hw/fpga/bitstream_manifests/core.toml
          for VARIANT in $(echo '${{ needs.setup.outputs.variants }}' | jq -r '.[]'); do
            git add "hw/fpga/bitstream_manifests/${VARIANT}.toml"
          done
          git commit -m "Update bitstream manifests for run ${{ github.run_id }}"
          git push origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "Update bitstream manifest: Run ${{ github.run_id }}" \
            --body "Automated update for run ${{ github.run_id }}. [GCS Manifest](https://storage.googleapis.com/caliptra-github-ci-bitstreams/v1/${{ github.sha }}/manifest.toml)" \
            --head "${{ env.BRANCH_NAME }}" \
