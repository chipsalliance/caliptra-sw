name: Build FPGA SD image

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fpga-image.yml"
      - "ci-tools/fpga-image/**"
      - "hw/fpga/**"

  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/fpga-image.yml"
      - "ci-tools/fpga-image/**"
      - "hw/fpga/**"

  schedule:
    # 5:13 AM PST tuesday, thursday
    - cron: '13 13 * * 2,4'

  workflow_call:
    inputs:
      branch:
        default: ${{ github.sha }}
        type: string
  workflow_dispatch:

permissions:
  contents: read

env:
  GCS_NIX_CACHE_BUCKET: gs://caliptra-github-ci-caliptra-reports/nix-cache
  GCS_NIX_CACHE_URL: https://storage.googleapis.com/caliptra-github-ci-caliptra-reports/nix-cache

jobs:
  build_sd_image:
    runs-on: ubuntu-24.04
    outputs:
      cache_updated: ${{ steps.export_cache.outputs.cache_updated }}
    strategy:
      matrix:
        image_variant: [core, subsystem]
    env:
      IMAGE_VARIANT: ${{ matrix.image_variant }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Install binfmt support for aarch64-linux
        run: |
          sudo apt-get update
          sudo apt-get -y install binfmt-support qemu-user-static

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            extra-platforms = aarch64-linux
            extra-substituters = ${{ env.GCS_NIX_CACHE_URL }}?trusted=1
            require-sigs = false
            sandbox = false

      - name: Build Dev and CI SD card images in Nix
        run: |
          cd ci-tools/fpga-image

          # Build Dev image (mutable ext4 + SSH keys + resize-rootfs)
          nix build -L "path:.#vck190-${IMAGE_VARIANT}-dev" -o result-dev
          cp -f result-dev/dev-image.img dev-image.img

          # Build CI image (immutable zstd SquashFS + tmpfs overlay)
          mkdir -p out
          nix build -L "path:.#vck190-${IMAGE_VARIANT}-ci" -o result-ci
          cp -f result-ci/image.img out/image.img

      - name: Export newly built boot firmware and kernel store paths on cache miss
        id: export_cache
        run: |
          cd ci-tools/fpga-image
          TARGETS=(
            "path:.#boot-bin-${IMAGE_VARIANT}"
            "path:.#system-dtb"
            "path:.#boot-scr"
            "path:.#linux-xlnx"
            "path:.#io-module-${IMAGE_VARIANT}"
          )
          if nix path-info --store "${GCS_NIX_CACHE_URL}" "${TARGETS[@]}" >/dev/null 2>&1; then
            echo "All kernel and boot firmware store paths are already cached in ${GCS_NIX_CACHE_BUCKET}."
          else
            echo "Cache miss detected; exporting store paths for GCS upload..."
            mkdir -p /tmp/nix-vck190-cache
            nix copy --to "file:///tmp/nix-vck190-cache?compression=zstd" "${TARGETS[@]}"
            echo "cache_updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Nix cache bundle artifact
        if: steps.export_cache.outputs.cache_updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nix-vck190-cache-${{ matrix.image_variant }}
          path: /tmp/nix-vck190-cache
          retention-days: 1

      - name: Upload dev-image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: caliptra-fpga-image-${{ matrix.image_variant }}-dev
          path: ci-tools/fpga-image/dev-image.img
          retention-days: 90

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: caliptra-fpga-image-${{ matrix.image_variant }}
          path: ci-tools/fpga-image/out/image.img
          retention-days: 90

  upload_nix_cache:
    runs-on: e2-standard-2-reporter
    needs: [build_sd_image]
    if: needs.build_sd_image.outputs.cache_updated == 'true'
    steps:
      - name: Download Nix cache bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nix-vck190-cache-*
          merge-multiple: true
          path: /tmp/nix-vck190-cache

      - name: Sync Nix cache to GCS
        run: |
          export PATH="$PATH:/snap/bin"
          gcloud storage rsync --recursive /tmp/nix-vck190-cache "${GCS_NIX_CACHE_BUCKET}"
