[package]
name = "caliptra-coverage"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
serde = {workspace = true, features = ["derive"]}
serde_json.workspace  = true
hex.workspace = true
rand.workspace = true
bit-vec = { workspace = true, features = ["serde"] }
caliptra-builder = { workspace = true, features = ["openssl"] }
elf.workspace = true
regex.workspace = true
caliptra-image-types.workspace = true
caliptra-drivers = { workspace = true, default-features = false }

[features]
"2.1" = ["caliptra-builder/2.1", "caliptra-drivers/2.1"]
"2.2" = ["caliptra-builder/2.2", "caliptra-drivers/2.2"]
